study:
  title: "ODI powerplay performance, source-stated pre-match pitch effects, and match outcomes"
  match_type: "ODI"
  gender: "male"
  primary_start_year: 2015
  primary_end: "fixed_data_snapshot"
  competition_scope: "all_mens_odi_competition_types"
  world_cup_role: "subgroup_sensitivity_only"
  random_seed: 20250905

chronological_split:
  development_end: "2023-12-31"
  validation_start: "2024-01-01"
  validation_end: "2024-12-31"
  locked_test_start: "2025-01-01"
  locked_test_end: "fixed_data_snapshot"

deliverables:
  long_term:
    name: "Expanded ODI research paper"
    scope: "all modern men's ODIs with historical and competition-type sensitivity analyses"
  ssac27:
    role: "near-term milestone, not final project boundary"
    track: "Other Sports"
    abstract_due_et: "2026-10-01T23:59:00-04:00"
    abstract_word_limit_including_title: 499
    maximum_tables_and_figures_combined: 2
    repository_must_be_open_source_at_submission: true
    require_actual_results: true

cohort:
  require_two_regulation_innings: true
  require_complete_ten_overs: true
  exclude_super_overs: true
  exclude_ties: true
  exclude_no_results: true
  exclude_abandoned: true
  exclude_dls_or_revised_target_primary: true
  keep_excluded_rows_in_audit_file: true

powerplay:
  first_over_index: 0
  last_over_index_inclusive: 9
  dot_denominator: "legal_balls"
  boundary_denominator: "legal_balls"
  count_boundary_when_non_boundary_flagged: false
  wicket_kinds_not_counted:
    - "retired hurt"

pitch:
  source_timing: "published_before_match_start"
  coding_rule: "explicit_source_stated_playing_effects_only"
  independent_pitch_analysis_allowed: false
  infer_effect_from_physical_surface_description: false
  physical_surface_descriptors_role: "provenance_note_only_never_used_to_derive_model_fields"
  unstated_effect_policy: "leave_blank_or_unknown_never_infer"
  legacy_228_release_status: "reaudit_complete_compliant_derivative_available"
  require_explicit_source_effect_reaudit_before_final_pitch_modeling: true
  require_independent_human_reliability_before_final_pitch_claim: true
  primary_features:
    - "batting_ease"
    - "pace_seam_support"
    - "spin_support"
    - "bounce_profile"
    - "two_paced_expected"
  secondary_match_condition:
    - "dew_expected_when_explicitly_reported"
  excluded_generic_weather_features:
    - "temperature"
    - "humidity"
    - "precipitation"
    - "cloud_cover"
    - "wind_speed"
    - "dew_point"

strength:
  primary_method: "elo"
  initial_rating: 1500.0
  k_factor: 20.0
  same_date_updates_are_batched: true
  sensitivity_methods:
    - "rolling_20_match_win_rate"

modeling:
  prediction_unit: "team_innings"
  group_id: "match_id"
  outcome: "batting_team_won"
  baseline_models:
    - "intercept_only"
    - "prematch_context_logistic"
    - "powerplay_only_logistic"
  primary_models:
    - "penalized_logistic_regression"
    - "random_forest"
    - "xgboost"
  nested_feature_blocks:
    m0: "prematch_strength_source_stated_pitch_effects_toss_innings_venue_year_competition"
    m1: "m0_plus_powerplay_runs_and_wickets"
    m2: "m1_plus_prespecified_source_stated_pitch_effect_and_innings_interactions"
  metrics:
    - "accuracy"
    - "roc_auc"
    - "log_loss"
    - "brier_score"
    - "calibration_intercept"
    - "calibration_slope"
  bootstrap:
    repetitions: 2000
    cluster: "match_id"
    confidence_level: 0.95
