name: Build ODI dataset and context

on:
  push:
    branches:
      - research/full-odi-pipeline
    paths:
      - "src/odi_powerplay/**"
      - "scripts/download_cricsheet.py"
      - "scripts/build_clean_dataset.py"
      - "scripts/build_pitch_queue.py"
      - "scripts/build_venue_geocodes.py"
      - "scripts/build_weather_dataset.py"
      - ".github/workflows/build_dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download official Cricsheet ODI JSON snapshot
        run: python scripts/download_cricsheet.py --output-dir data/raw/cricsheet

      - name: Build auditable ODI powerplay cohorts
        run: python scripts/build_clean_dataset.py | tee dataset-build.log

      - name: Build outcome-blind pitch collection queue
        run: python scripts/build_pitch_queue.py

      - name: Geocode unique venue-city pairs
        run: python scripts/build_venue_geocodes.py | tee geocode-build.log

      - name: Smoke-test historical weather collection
        run: |
          python scripts/build_weather_dataset.py \
            --output data/processed/match_weather_smoke.csv \
            --raw-dir data/raw/weather/smoke \
            --limit 50 \
            | tee weather-build.log

      - name: Show dataset summary
        run: cat data/processed/dataset_summary.json

      - name: Upload reproducible research-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: odi-powerplay-dataset
          retention-days: 30
          if-no-files-found: error
          path: |
            data/raw/cricsheet/source_manifest.json
            data/raw/weather/geocoding_responses.jsonl
            data/raw/weather/smoke/*.json
            data/interim/powerplay_innings_all.csv
            data/processed/powerplay_innings_clean.csv
            data/processed/powerplay_innings_primary.csv
            data/processed/match_cohort_audit.csv
            data/processed/match_exclusions.csv
            data/processed/dataset_summary.json
            data/processed/pitch_collection_queue.csv
            data/processed/venue_geocodes.csv
            data/processed/match_weather_smoke.csv
            dataset-build.log
            geocode-build.log
            weather-build.log
