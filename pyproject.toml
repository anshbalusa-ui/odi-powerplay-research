[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odi-powerplay-research"
version = "0.1.0"
description = "Reproducible ODI powerplay conditions and match-outcome research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib==1.4.2",
  "matplotlib==3.9.3",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "seaborn==0.13.2",
  "shap==0.46.0",
  "statsmodels==0.14.4",
  "xgboost==2.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

