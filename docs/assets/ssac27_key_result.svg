<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Finite run compensation is supported in only 3 of 18 match contexts</title>
  <desc id="desc">A six-row by three-column grid crossing innings order and Elo difference with prior venue powerplay scoring environment. Only three cells show finite supported run compensation values: 14.1, 13.2, and 29.8 runs. The remaining fifteen cells have no finite supported compensation within the observed run range.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">A universal powerplay wicket value is not supported</text>
  <text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">Finite run compensation for the 1→2 wicket contrast at 47 runs appears in only 3 of 18 prespecified contexts.</text>

  <text x="655" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#374151">Prior venue powerplay mean</text>
  <text x="540" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">43.1</text>
  <text x="760" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">47.9</text>
  <text x="980" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">53.0</text>

  <text x="60" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Batting first · Elo −107</text>
  <text x="60" y="316" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Batting first · Elo 0</text>
  <text x="60" y="386" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Batting first · Elo +107</text>
  <text x="60" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Chasing · Elo −107</text>
  <text x="60" y="526" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Chasing · Elo 0</text>
  <text x="60" y="596" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111827">Chasing · Elo +107</text>

  <!-- row 1 -->
  <rect x="440" y="220" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="660" y="220" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="880" y="220" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <!-- row 2 -->
  <rect x="440" y="290" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="660" y="290" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="880" y="290" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <!-- row 3 -->
  <rect x="440" y="360" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="660" y="360" width="200" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <rect x="880" y="360" width="200" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <!-- row 4 -->
  <rect x="440" y="430" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="660" y="430" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="880" y="430" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <!-- row 5 -->
  <rect x="440" y="500" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="660" y="500" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="880" y="500" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <!-- row 6 -->
  <rect x="440" y="570" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="660" y="570" width="200" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <rect x="880" y="570" width="200" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>

  <!-- unsupported symbols -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#9ca3af" text-anchor="middle">
    <text x="540" y="252">—</text><text x="760" y="252">—</text><text x="980" y="252">—</text>
    <text x="540" y="322">—</text><text x="760" y="322">—</text><text x="980" y="322">—</text>
    <text x="540" y="392">—</text>
    <text x="540" y="462">—</text><text x="760" y="462">—</text><text x="980" y="462">—</text>
    <text x="540" y="532">—</text><text x="760" y="532">—</text><text x="980" y="532">—</text>
    <text x="540" y="602">—</text><text x="760" y="602">—</text>
  </g>

  <!-- supported values -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <text x="760" y="391">14.1 runs</text>
    <text x="980" y="391">13.2 runs</text>
    <text x="980" y="601">29.8 runs</text>
  </g>

  <rect x="60" y="650" width="18" height="18" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="90" y="665" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151">Finite supported compensation</text>
  <text x="355" y="665" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9ca3af">—</text>
  <text x="380" y="665" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151">No finite supported compensation within observed run range</text>
  <text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Aggregate SSAC27 result; observational model-standardized association, not a causal wicket price.</text>
</svg>